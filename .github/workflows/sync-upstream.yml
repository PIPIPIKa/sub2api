name: Sync Upstream

on:
  schedule:
    # 每天北京时间 08:30 检查一次官方仓库更新
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      auto_merge_clean:
        description: '无冲突时直接合并到 main（默认仅创建或更新 PR 供审阅）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Wei-Shaw/sub2api main
        id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main --no-tags

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Commits behind upstream/main: $BEHIND ($UPSTREAM_SHA)"

      - name: Merge upstream into sync branch or main
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE: ${{ inputs.auto_merge_clean == true }}
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          SYNC_BRANCH="chore/sync-upstream-main"
          git checkout -B "$SYNC_BRANCH" origin/main

          MERGED=false
          if git merge --no-edit upstream/main; then
            MERGED=true
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [[ "$CONFLICTS" == "backend/cmd/server/VERSION" ]]; then
              python3 - <<'PY'
          import re, subprocess
          def key(v):
              v = v.strip().lstrip('v')
              base, _, suffix = v.partition('-')
              parts = [int(x) if x.isdigit() else 0 for x in (base.split('.') + ['0', '0'])[:3]]
              m = re.fullmatch(r'p(\d+)', suffix.lower())
              return (*parts, int(m.group(1)) if m else 0)
          ours = subprocess.check_output(['git', 'show', ':2:backend/cmd/server/VERSION'], text=True).strip()
          theirs = subprocess.check_output(['git', 'show', ':3:backend/cmd/server/VERSION'], text=True).strip()
          winner = theirs if key(theirs) >= key(ours) else ours
          open('backend/cmd/server/VERSION', 'w').write(winner + '\n')
          print(f'Resolved VERSION conflict: ours={ours}, theirs={theirs} -> {winner}')
          PY
              git add backend/cmd/server/VERSION
              git commit --no-edit
              MERGED=true
            fi
          fi

          if [[ "$MERGED" != "true" ]]; then
            git merge --abort || true
            echo "::warning::与官方 upstream/main 存在代码冲突，请本地执行 git fetch upstream && git merge upstream/main 处理。"
            exit 1
          fi

          if [[ "$AUTO_MERGE" == "true" ]]; then
            git checkout main
            git merge --ff-only "$SYNC_BRANCH"
            git push origin main
            exit 0
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$SYNC_BRANCH" --base main --json number --jq '.[0].number // empty')
          BODY="自动检测到上游 \`Wei-Shaw/sub2api\` 新增 ${BEHIND} 个提交（最新 \`${UPSTREAM_SHA}\`），已自动合并到 \`${SYNC_BRANCH}\`。CI 通过后可直接合并并按需打 \`vX.Y.Z-p1\` 标签发版。"
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --repo "${{ github.repository }}" --title "chore(sync): 同步官方上游 main (${UPSTREAM_SHA})" --body "$BODY"
          else
            gh pr create --repo "${{ github.repository }}" --base main --head "$SYNC_BRANCH" --title "chore(sync): 同步官方上游 main (${UPSTREAM_SHA})" --body "$BODY"
          fi
