name: Sync Upstream

on:
  schedule:
    # 每天北京时间 08:30 检查一次官方仓库更新
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      auto_merge_clean:
        description: '无冲突时直接快进/合并到 main（默认仅创建或更新 PR 供审阅）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Wei-Shaw/sub2api main and tags
        id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main --tags
          git push origin --tags

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Commits behind upstream/main: $BEHIND ($UPSTREAM_SHA)"

      - name: Merge upstream into sync branch or main
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE: ${{ inputs.auto_merge_clean == true }}
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          SYNC_BRANCH="chore/sync-upstream-main"
          git checkout -B "$SYNC_BRANCH" origin/main

          if git merge --no-edit upstream/main; then
            if [[ "$AUTO_MERGE" == "true" ]]; then
              git checkout main
              git merge --ff-only "$SYNC_BRANCH"
              git push origin main
              exit 0
            fi
            git push --force-with-lease origin "$SYNC_BRANCH"
            EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$SYNC_BRANCH" --base main --json number --jq '.[0].number // empty')
            BODY="自动检测到上游 \`Wei-Shaw/sub2api\` 新增 ${BEHIND} 个提交（最新 \`${UPSTREAM_SHA}\`），已无冲突合并到 \`${SYNC_BRANCH}\`。CI 通过后可直接合并并按需打 \`vX.Y.Z-p1\` 标签发版。"
            if [[ -n "$EXISTING" ]]; then
              gh pr edit "$EXISTING" --repo "${{ github.repository }}" --title "chore(sync): 同步官方上游 main (${UPSTREAM_SHA})" --body "$BODY"
            else
              gh pr create --repo "${{ github.repository }}" --base main --head "$SYNC_BRANCH" --title "chore(sync): 同步官方上游 main (${UPSTREAM_SHA})" --body "$BODY"
            fi
          else
            git merge --abort || true
            echo "::warning::与官方 upstream/main 存在合并冲突，请本地执行 git fetch upstream && git merge upstream/main 处理。"
            exit 1
          fi
